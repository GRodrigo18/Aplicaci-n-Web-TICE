# Blueprint de Render: PostgreSQL 16 + sistema web TICE en un solo servicio Docker (plan gratuito)
databases:
  - name: tice-db
    databaseName: tice
    user: tice
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: sistema-tice
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATOS_DEMO
        value: "true"

  # Administrador de la base de datos en el navegador (Adminer), separado del sistema.
  # Se entra con el usuario y la contraseña de tice-db (Connect > Internal).
  - type: web
    name: visor-bd-tice
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.adminer
    dockerContext: .
    envVars:
      - key: ADMINER_DEFAULT_SERVER
        fromDatabase:
          name: tice-db
          property: host
