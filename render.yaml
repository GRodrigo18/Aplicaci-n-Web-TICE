# Blueprint de Render: PostgreSQL 16 + sistema web TICE en un solo servicio Docker (plan gratuito)
databases:
  - name: tice-db
    databaseName: tice
    user: tice
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: sistema-tice
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATOS_DEMO
        value: "true"
