# Blueprint de Render: PostgreSQL 16 + sistema web TICE en un solo servicio Docker (plan gratuito)
databases:
  - name: tice-db
    databaseName: tice
    user: tice
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: sistema-tice
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATOS_DEMO
        value: "true"

  # Visor de la base de datos en el navegador (pgweb), separado del sistema. Pide usuario y contraseña
  # (Environment > PGWEB_AUTH_PASS) y no permite modificar datos.
  - type: web
    name: visor-bd-tice
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.pgweb
    dockerContext: .
    envVars:
      - key: PGWEB_DATABASE_URL
        fromDatabase:
          name: tice-db
          property: connectionString
      - key: PGWEB_AUTH_USER
        value: admin
      - key: PGWEB_AUTH_PASS
        generateValue: true
